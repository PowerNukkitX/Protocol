name: Feature request
description: Suggest a new packet, version or API change
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you've tried.

  - type: textarea
    attributes:
      label: Additional context
      description: Links to Mojang's protocol docs, changelogs or anything else that helps.
